<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Akupunkturní atlas</title>
  <meta name="description" content="Interaktivní atlas akupunkturních bodů v češtině: najděte bod podle potíže, vyhledejte, co bod dělá, nebo klikněte na bod na těle.">
  <meta name="theme-color" content="#1e5c50">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- APP:START -->
  <div class="app">
    <aside class="panel" aria-label="Hledání bodů">
      <header class="brand">
        <span class="seal" aria-hidden="true">穴</span>
        <div>
          <h1>Akupunkturní atlas</h1>
          <p id="brand-sub">Body, dráhy a jejich účinky</p>
        </div>
      </header>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-need" aria-controls="pane-need" aria-selected="true">Co potřebuji</button>
        <button type="button" role="tab" id="tab-find" aria-controls="pane-find" aria-selected="false">Hledat bod</button>
      </div>

      <div class="panel-body" id="panel-body">
        <section id="pane-need" role="tabpanel" aria-labelledby="tab-need">
          <form id="need-form" class="ask" autocomplete="off">
            <label for="need-input">Napište, s čím chcete pomoct</label>
            <div class="ask-row">
              <textarea id="need-input" rows="2" placeholder="Např. bolí mě hlava a nemůžu spát"></textarea>
              <button type="submit" class="btn-primary">Najít body</button>
            </div>
          </form>
          <div class="chips" id="need-chips" aria-label="Časté potíže"></div>
          <div id="need-results" aria-live="polite"></div>
        </section>

        <section id="pane-find" role="tabpanel" aria-labelledby="tab-find" hidden>
          <div class="ask">
            <label for="find-input">Kód, název nebo účinek bodu</label>
            <input id="find-input" type="search" placeholder="LI4, Hegu, Žaludek, nevolnost…" autocomplete="off">
          </div>
          <div id="find-results" aria-live="polite"></div>
        </section>

        <section id="detail" hidden aria-live="polite"></section>

        <footer class="disclaimer">
          Informace slouží ke vzdělávání a svépomocné akupresuře. Nenahrazují vyšetření lékařem. Při silné, náhlé nebo dlouhotrvající bolesti vyhledejte lékaře.
        </footer>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Pohled">
          <button type="button" data-preset="both" aria-pressed="false">Obě</button>
          <button type="button" data-preset="f" aria-pressed="false">Zepředu</button>
          <button type="button" data-preset="b" aria-pressed="false">Zezadu</button>
        </div>
        <div class="zoom" role="group" aria-label="Přiblížení">
          <button type="button" id="zoom-in" aria-label="Přiblížit">+</button>
          <button type="button" id="zoom-out" aria-label="Oddálit">−</button>
        </div>
      </div>

      <svg id="body" role="img" aria-label="Postava s akupunkturními body, pohled zepředu a zezadu" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="legend" id="legend" role="group" aria-label="Filtr podle prvku"></div>
      <div class="tip" id="tip" hidden></div>
      <p class="hint" id="hint">Kolečkem myši nebo dvěma prsty přiblížíte, tažením posunete. Klepněte na bod.</p>
    </main>
  </div>
  <!-- APP:END -->

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
